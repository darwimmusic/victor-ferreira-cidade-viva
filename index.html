<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Victor Ferreira</title>
    <style>
      :root { --ui-bg: rgba(255,255,255,.93); --ui-bg-solid: #fff; --ui-fg: #111; --ui-fg2: #333; --ui-mu: #777; --ui-ln: #e6e6e3; --ui-btn: #fff; --ui-img: #f4f4f2; }
      html, body { margin: 0; background: #fff; color: var(--ui-fg); transition: color .6s; font-family: 'Geist Variable', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; overflow: hidden; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="gl" style="position:fixed;inset:0;width:100vw;height:100vh;display:block"></canvas>

    <div id="intro" style="position:fixed;top:16vh;left:50%;transform:translate3d(-50%,0,0);text-align:center;pointer-events:none;transition:opacity .9s">
      <div style="font-size:clamp(48px,7.4vw,118px);font-weight:200;letter-spacing:-.045em;line-height:1">Victor Ferreira</div>
      <div style="margin-top:18px;font-size:14px;font-weight:300;letter-spacing:.02em;color:#555">Arquitetura&nbsp;&nbsp;·&nbsp;&nbsp;Eventos&nbsp;&nbsp;·&nbsp;&nbsp;Tecnologia</div>
    </div>

    <div id="outro" style="position:fixed;top:18vh;left:50%;transform:translate3d(-50%,0,0);opacity:0;text-align:center;transition:opacity 1.2s;z-index:21">
      <div style="font-size:clamp(40px,5.6vw,92px);font-weight:200;letter-spacing:-.045em;line-height:1">Vamos construir o próximo.</div>
      <a style="display:inline-block;margin-top:26px;padding:12px 26px;border:1px solid #111;border-radius:999px;font-size:14px;font-weight:300;color:#111;text-decoration:none">Contato</a>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
